[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Actuator's health endpoint also reports datasource and Kafka connectivity, so
# a green check here means the pipeline is actually able to work, not merely
# that the process is alive.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# A single replica, deliberately. The rate limiter keeps its counters in memory,
# so N replicas permit N times the configured rate. Move that state to Redis
# before scaling this number up.
numReplicas = 1
