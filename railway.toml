[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Covers the process and the datasource: Boot's health endpoint returns 503 if
# the database is unreachable, so a green check means more than "the process is
# alive". It does NOT cover Kafka. Boot ships no Kafka health indicator, and the
# admin client is non-fatal by default, so the app boots and reports healthy
# with a broken broker while ingest accepts events that never persist. Only an
# end-to-end POST followed by /api/v1/analytics/summary proves the pipeline.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# A single replica, deliberately. The rate limiter keeps its counters in memory,
# so N replicas permit N times the configured rate. Move that state to Redis
# before scaling this number up.
numReplicas = 1
