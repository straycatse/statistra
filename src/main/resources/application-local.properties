# Local development profile. Activate with:
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# Seeds a fixed development organization (see DevOrgSeeder) so you can send
# events immediately without calling the admin API first.
statistra.seed-dev-org=true
statistra.admin.token=${ADMIN_TOKEN:local-dev-admin-token}

logging.level.com.straycat.statistra=DEBUG
