spring.application.name=Statistra
server.port=${PORT:8080}

# --- Datasource -------------------------------------------------------------
# Every value is env-overridable. Defaults point at the local docker-compose
# stack so a fresh checkout runs without configuration. No literal secrets here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5444/statistra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JPA --------------------------------------------------------------------
# Flyway owns the schema. `validate` makes Hibernate check the entities against
# what Flyway built and fail fast on drift, rather than silently altering it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Kafka ------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.retries=10

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:analytics-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.straycat.statistra.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.straycat.statistra.model.AnalyticsEvent
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual

statistra.kafka.topic=${KAFKA_TOPIC:analytics-events}
statistra.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
statistra.kafka.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}

# --- Application ------------------------------------------------------------
# Empty by default. The admin API then answers 503 rather than running
# unauthenticated, so an unprotected key-minting endpoint cannot be deployed by
# accident. Set ADMIN_TOKEN to enable it.
statistra.admin.token=${ADMIN_TOKEN:}
# Keeps the database off the ingest path. Authentication used to read Postgres
# on every request, so an outage took ingest down even though Kafka was healthy
# and could have buffered. The cost is bounded staleness: a rotated key stays
# valid for up to this long on instances that did not perform the rotation.
# Set to 0s to disable and go back to a read per request.
statistra.auth.cache-ttl=${AUTH_CACHE_TTL:60s}
statistra.auth.cache-max-entries=${AUTH_CACHE_MAX_ENTRIES:10000}

statistra.ingest.max-body-bytes=${MAX_BODY_BYTES:1048576}
statistra.ingest.max-batch-size=${MAX_BATCH_SIZE:500}
statistra.ingest.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:6000}

# --- Actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.com.straycat.statistra=${LOG_LEVEL:INFO}
