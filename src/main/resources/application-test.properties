# Test profile. Datasource and Kafka bootstrap are supplied at runtime by
# Testcontainers via @ServiceConnection, so no connection details belong here.
statistra.seed-dev-org=true
statistra.admin.token=test-admin-token
statistra.ingest.rate-limit-per-minute=100000

spring.kafka.consumer.auto-offset-reset=earliest
logging.level.com.straycat.statistra=DEBUG
logging.level.org.testcontainers=WARN
logging.level.org.apache.kafka=WARN
