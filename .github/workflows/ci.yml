name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Docker is available on ubuntu-latest, which is all Testcontainers needs;
    # it starts Postgres and Kafka itself, so no service containers are declared.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test

      - name: Build Docker image
        run: docker build -t statistra:${{ github.sha }} .
